name: Update LOF data

on:
  workflow_dispatch:      # 支持手动触发
  schedule:
    - cron: "30 1 * * 1-5"   # 北京时间 09:30 开盘后
    - cron: "0 8 * * 1-5"    # 北京时间 16:00 收盘后
    - cron: "0 14 * * 1-6"   # 北京时间 22:00 净值公布后

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch data
        run: python fetch_data.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: update LOF nav data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
